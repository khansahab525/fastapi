<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Albassami Cargo Assistant</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml" />
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface-2: #243044;
      --accent: #009688;
      --accent-hover: #00796b;
      --text: #e8eef4;
      --muted: #8b9cb3;
      --user-bubble: #00695c;
      --bot-bubble: #243044;
      --border: #2d3f56;
      --error: #ef5350;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header .logo {
      width: 40px;
      height: 40px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.25rem;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    header p { font-size: 0.8rem; color: var(--muted); }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    .message {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      align-self: flex-start;
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .message.error {
      align-self: center;
      background: rgba(239, 83, 80, 0.15);
      border: 1px solid var(--error);
      color: #ffcdd2;
      max-width: 100%;
      font-size: 0.85rem;
    }
    .message.typing {
      color: var(--muted);
      font-style: italic;
    }
    .welcome {
      text-align: center;
      color: var(--muted);
      padding: 2rem 1rem;
      font-size: 0.9rem;
    }
    .welcome strong { color: var(--accent); display: block; margin-bottom: 0.5rem; font-size: 1rem; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1rem;
    }
    .chip {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .chip:hover { background: var(--accent); border-color: var(--accent); }
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 1rem 1.25rem 1.25rem;
    }
    .composer {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      min-height: 48px;
      max-height: 140px;
      line-height: 1.4;
    }
    #input:focus {
      outline: none;
      border-color: var(--accent);
    }
    #send {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 1.25rem;
      height: 48px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #send:hover:not(:disabled) { background: var(--accent-hover); }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <div class="logo">A</div>
    <div>
      <h1>Albassami Cargo Assistant</h1>
      <p>Ask about cargo line status, residual amount, delivery &amp; trip info</p>
    </div>
  </header>

  <main id="chat">
    <div class="welcome">
      <strong>مرحباً · Welcome</strong>
      Ask about a cargo line reference (e.g. P123…), chassis, plate, mobile, or order number.
      <div class="chips">
        <button type="button" class="chip" data-prompt="What is the status and residual amount for line P?">Line status &amp; residual</button>
        <button type="button" class="chip" data-prompt="Search cargo lines by plate number ">Search by plate</button>
        <button type="button" class="chip" data-prompt="Show cargo order details for order ">Order details</button>
      </div>
    </div>
  </main>

  <footer>
    <form class="composer" id="form">
      <textarea id="input" rows="1" placeholder="Type your question…" autocomplete="off"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </footer>

  <script>
    const chatEl = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const SESSION_KEY = "albassami_chat_session_id";

    let sessionId = localStorage.getItem(SESSION_KEY);
    let busy = false;

    function appendMessage(text, role) {
      const welcome = chatEl.querySelector(".welcome");
      if (welcome) welcome.remove();

      const el = document.createElement("div");
      el.className = `message ${role}`;
      el.textContent = text;
      chatEl.appendChild(el);
      chatEl.scrollTop = chatEl.scrollHeight;
      return el;
    }

    function setBusy(value) {
      busy = value;
      sendBtn.disabled = value;
      input.disabled = value;
    }

    async function sendMessage(text) {
      const message = text.trim();
      if (!message || busy) return;

      appendMessage(message, "user");
      input.value = "";
      input.style.height = "auto";
      setBusy(true);

      const typing = appendMessage("Thinking…", "typing assistant");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, session_id: sessionId }),
        });

        const data = await res.json().catch(() => ({}));

        typing.remove();

        if (!res.ok) {
          const detail = data.detail || res.statusText || "Request failed";
          appendMessage(typeof detail === "string" ? detail : JSON.stringify(detail), "error");
          return;
        }

        if (data.session_id) {
          sessionId = data.session_id;
          localStorage.setItem(SESSION_KEY, sessionId);
        }

        appendMessage(data.reply || "(No response)", "assistant");
      } catch (err) {
        typing.remove();
        appendMessage("Network error: " + err.message, "error");
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage(input.value);
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    });

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        input.value = chip.dataset.prompt || "";
        input.focus();
      });
    });
  </script>
</body>
</html>
