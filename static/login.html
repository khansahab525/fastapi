<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Albsassami AI | Login</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #2aa3e6 0%, #1f8fd6 35%, #1577c4 70%, #0f63ad 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    /* decorative soft spheres, like the screenshot */
    .orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.45), rgba(120,200,255,0.15) 55%, rgba(255,255,255,0) 70%);
    }
    .orb-1 { width: 460px; height: 460px; left: -140px; bottom: -120px; }
    .orb-2 { width: 90px; height: 90px; left: 210px; top: 46%; opacity: 0.9; }

    .login-block {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 116px;
      height: 116px;
      border-radius: 20px;
      margin-bottom: -40px;
      object-fit: cover;
      box-shadow: 0 8px 22px rgba(0,0,0,.28);
      background: #fff;
      position: relative;
      z-index: 3;
    }
    .card {
      width: 100%;
      background: rgba(214, 235, 250, 0.92);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 10px;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
      padding: 3.6rem 2.2rem 2.2rem;
      backdrop-filter: blur(4px);
    }
    .card h1 {
      text-align: center;
      font-size: 1.7rem;
      font-weight: 700;
      color: #1a2a3a;
      margin-bottom: 1.7rem;
    }
    .field {
      position: relative;
      margin-bottom: 1.2rem;
    }
    .field input {
      width: 100%;
      padding: 0.85rem 0.9rem;
      border: 1px solid #5b6b7a;
      border-radius: 5px;
      font-size: 1.02rem;
      background: #fff;
      color: #1a2a3a;
      outline: none;
    }
    .field input:focus { border-color: #0f63ad; box-shadow: 0 0 0 2px rgba(15,99,173,.2); }
    /* floating label that overlaps the top border (screenshot style) */
    .field .float-label {
      position: absolute;
      top: -8px;
      left: 10px;
      padding: 0 5px;
      background: rgba(214, 235, 250, 0.95);
      font-size: 0.78rem;
      font-weight: 600;
      color: #1a2a3a;
    }
    .field.has-eye input { padding-right: 2.6rem; }
    .eye {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #4a5b6a;
      font-size: 1.1rem;
      line-height: 1;
      padding: 4px;
    }
    .remember {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: #1a2a3a;
      margin: 0.2rem 0 1.1rem;
    }
    .remember input { width: 18px; height: 18px; accent-color: #0f63ad; }
    .btn-login {
      width: 100%;
      padding: 0.85rem;
      background: #0f63ad;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-login:hover { background: #0c558f; }
    .btn-login:disabled { opacity: 0.65; cursor: not-allowed; }
    .error {
      background: #f8d7da;
      color: #842029;
      border: 1px solid #f5c2c7;
      border-radius: 4px;
      padding: 0.6rem 0.75rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }
    @media (max-width: 720px) {
      body { justify-content: center; padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="login-block">
    <img class="logo" src="/logo.jpeg" alt="Albsassami" />
    <div class="card">
      <h1>Log in to Albsassami AI</h1>
      <form id="login-form">
        <div id="error" class="error"></div>
        <div class="field">
          <span class="float-label">Account name or email</span>
          <input id="login" name="login" type="text" autocomplete="username" required />
        </div>
        <div class="field has-eye">
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Password" />
          <button type="button" class="eye" id="toggle-pw" aria-label="Show password">&#128065;</button>
        </div>
        <label class="remember">
          <input type="checkbox" id="remember" checked />
          Remember me
        </label>
        <button type="submit" class="btn-login" id="submit">&#8594;&nbsp; Log in</button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit");
    const pw = document.getElementById("password");
    const toggle = document.getElementById("toggle-pw");

    toggle.addEventListener("click", () => {
      pw.type = pw.type === "password" ? "text" : "password";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      submitBtn.disabled = true;

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            login: document.getElementById("login").value.trim(),
            password: pw.value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const msg = data.detail || "Login failed";
          errorEl.textContent = typeof msg === "string" ? msg : JSON.stringify(msg);
          errorEl.style.display = "block";
          return;
        }
        window.location.href = "/";
      } catch (err) {
        errorEl.textContent = "Network error: " + err.message;
        errorEl.style.display = "block";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
