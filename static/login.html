<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Albassami | Login</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Roboto", "Segoe UI", Helvetica, Arial, sans-serif;
      background: #f0eeee url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4d4d4' fill-opacity='0.35'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      display: flex;
      flex-direction: column;
    }
    .odoo-navbar {
      background: #875a7b;
      color: #fff;
      padding: 0.6rem 1.5rem;
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      box-shadow: 0 1px 3px rgba(0,0,0,.12);
    }
    .wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #fff;
      width: 100%;
      max-width: 400px;
      border-radius: 3px;
      box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.1);
      overflow: hidden;
    }
    .card-head {
      text-align: center;
      padding: 2rem 1.5rem 1rem;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 1rem;
      background: #875a7b;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
    }
    .card-head h1 {
      font-size: 1.35rem;
      font-weight: 400;
      color: #4c4c4c;
    }
    .card-head p {
      font-size: 0.85rem;
      color: #888;
      margin-top: 0.35rem;
    }
    form {
      padding: 0 1.75rem 2rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 0.35rem;
    }
    input {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      outline: none;
    }
    input:focus {
      border-color: #875a7b;
      box-shadow: 0 0 0 2px rgba(135, 90, 123, 0.2);
    }
    .btn-login {
      width: 100%;
      padding: 0.65rem;
      background: #875a7b;
      color: #fff;
      border: none;
      border-radius: 3px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-login:hover { background: #714b67; }
    .btn-login:disabled { opacity: 0.65; cursor: not-allowed; }
    .error {
      background: #f8d7da;
      color: #842029;
      border: 1px solid #f5c2c7;
      border-radius: 3px;
      padding: 0.6rem 0.75rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }
    .footer {
      text-align: center;
      font-size: 0.75rem;
      color: #999;
      padding-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="odoo-navbar">Albassami Cargo</div>
  <div class="wrap">
    <div class="card">
      <div class="card-head">
        <div class="logo">A</div>
        <h1>Log in</h1>
        <p>Cargo chat assistant</p>
      </div>
      <form id="login-form">
        <div id="error" class="error"></div>
        <label for="login">Email</label>
        <input id="login" name="login" type="email" autocomplete="username" required placeholder="your@email.com" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit" class="btn-login" id="submit">Log in</button>
      </form>
      <div class="footer">Powered by Odoo credentials</div>
    </div>
  </div>
  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      submitBtn.disabled = true;

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            login: document.getElementById("login").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const msg = data.detail || "Login failed";
          errorEl.textContent = typeof msg === "string" ? msg : JSON.stringify(msg);
          errorEl.style.display = "block";
          return;
        }
        window.location.href = "/";
      } catch (err) {
        errorEl.textContent = "Network error: " + err.message;
        errorEl.style.display = "block";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
